<!DOCTYPE html>
<html>

<head>
    <title>SignalR Test</title>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>

</head>

<body>

    <h2>
        SignalR Test
    </h2>


    <script>

const connection =
    new signalR.HubConnectionBuilder()
        .withUrl("https://localhost:7283/hubs/operations")
        .build();


connection.start()
    .then(() =>
    {
        console.log("Connected");
    })
    .catch(error =>
    {
        console.error(error);
    });


    </script>

</body>

</html>
